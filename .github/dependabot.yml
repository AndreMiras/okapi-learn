version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:18"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "andremiras"
    commit-message:
      prefix: ":arrow_up:"
      include: "scope"
    # Ignore non-LTS Node.js versions for @types/node.
    # Update this when bumping to the next LTS (e.g. 26.x -> ignore 27.x).
    ignore:
      - dependency-name: "@types/node"
        versions: ["25.x"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      testing:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:18"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "andremiras"
    commit-message:
      prefix: ":arrow_up:"
      include: "scope"
